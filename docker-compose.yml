

services:
  postgres:
    image: postgres:16-alpine
    container_name: nioshcert-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nioshcert
      POSTGRES_PASSWORD: nioshcert_dev_password
      POSTGRES_DB: nioshcert_mandays
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nioshcert"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local